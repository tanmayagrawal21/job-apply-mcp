[project]
name = "job-apply-mcp"
version = "0.1.0"
description = "Modular, parallel, token-frugal MCP server for discovering and applying to jobs, with local-first LLM routing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "mcp>=1.2,<2",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
browser = ["playwright>=1.45,<2"]
hf = ["transformers>=4.44,<5"]
litellm = ["litellm>=1.83.0"]
mlx = ["mlx-lm>=0.18"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "respx>=0.21"]

[project.scripts]
job-apply-mcp = "job_apply_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_apply_mcp"]

[tool.uv]
# Supply-chain guard (ADR-0004): never resolve packages published in the last 14 days.
# Bump this date deliberately, in its own PR, after reviewing the lockfile diff.
exclude-newer = "2026-10-08T00:00:00Z"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: hits a real local Ollama (run with JAM_LIVE=1)"]

[tool.ruff]
line-length = 110
target-version = "py311"
