# Release (ADR-0042, docs/release.md): on a version tag, build and test, publish to PyPI with Trusted
# Publishing (OIDC, no token), publish server.json to the MCP Registry (GitHub OIDC), and attach the MCPB
# bundle plus the built distributions to a GitHub Release. Every action is pinned by commit SHA; npm tools are
# pinned by .github/release-tools/package-lock.json and installed with `npm ci --ignore-scripts`. Only the
# github-release job can write, and it runs no third-party code.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  MCP_PUBLISHER_VERSION: "1.8.1"
  MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"  # linux_amd64 tarball

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.12"
      - name: Tag must equal every pinned version
        id: version
        run: |
          uv run --no-project --python 3.12 python - <<'EOF'
          import json, os, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"]
          v = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          srv = json.load(open("server.json"))
          found = {
              "pyproject.toml": v,
              ".claude-plugin/plugin.json": json.load(open(".claude-plugin/plugin.json"))["version"],
              "server.json version": srv["version"],
              "server.json packages[0].version": srv["packages"][0]["version"],
              "mcpb/manifest.json": json.load(open("mcpb/manifest.json"))["version"],
              "mcpb/pyproject.toml pin": tomllib.load(open("mcpb/pyproject.toml", "rb"))["project"]["dependencies"][0].removeprefix("applywise=="),
          }
          bad = {k: x for k, x in found.items() if x != v}
          if tag != f"v{v}" or bad:
              sys.exit(f"tag {tag} vs version {v}; mismatches: {bad}")
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"version={v}\n")
          EOF
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv build
      - name: Smoke-test the wheel (both console scripts)
        run: |
          uv run --isolated --no-project --with dist/*.whl applywise version
          uv run --isolated --no-project --with dist/*.whl job-apply-mcp version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/applywise/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write   # Trusted Publishing; no API token exists
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  mcp-registry:
    needs: [build, pypi]
    runs-on: ubuntu-latest
    environment:
      name: pypi        # same protected environment as the PyPI publish (tag rule, required reviewer)
    permissions:
      contents: read
      id-token: write   # mcp-publisher login github-oidc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install mcp-publisher (pinned, checksum verified)
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - name: Wait for PyPI to serve the release
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null "https://pypi.org/pypi/applywise/${VERSION}/json" && exit 0
            sleep 10
          done
          echo "applywise ${VERSION} not on PyPI after 5 minutes" >&2
          exit 1
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

  mcpb:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - name: Install pinned mcpb (lockfile, no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix .github/release-tools
      - name: Validate and pack the bundle
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          .github/release-tools/node_modules/.bin/mcpb validate mcpb/manifest.json
          .github/release-tools/node_modules/.bin/mcpb pack mcpb "applywise-${VERSION}.mcpb"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: mcpb
          path: applywise-*.mcpb
          if-no-files-found: error

  github-release:
    needs: [build, pypi, mcpb]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release and upload assets; no checkout, no third-party code
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: mcpb
          path: mcpb-out/
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --verify-tag \
            --title "ApplyWise ${VERSION}" --notes "See CHANGELOG.md. PyPI: applywise==${VERSION}." \
            "mcpb-out/applywise-${VERSION}.mcpb" dist/*
