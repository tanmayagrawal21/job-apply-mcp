name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: {label: What happened and what did you expect?}
    validations: {required: true}
  - type: textarea
    id: doctor
    attributes:
      label: Output of `job-apply-mcp doctor --offline`
      description: Remove anything personal before pasting.
      render: text
    validations: {required: true}
  - type: input
    id: client
    attributes: {label: MCP client and version}
  - type: input
    id: os
    attributes: {label: OS, placeholder: "macOS 15 / Windows 11 / Ubuntu 24.04"}
  - type: markdown
    attributes:
      value: Never paste profile contents, resumes, tokens or API keys.
